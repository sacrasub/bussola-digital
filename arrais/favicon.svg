<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#0B192C"/>
  <circle cx="256" cy="256" r="200" stroke="#E0A96D" stroke-width="12" stroke-dasharray="16 8"/>
  <circle cx="256" cy="256" r="170" fill="#1E3E62" stroke="#E0A96D" stroke-width="4"/>
  <!-- Compass star -->
  <!-- North pointer (Gold/Red) -->
  <polygon points="256,90 285,256 256,220" fill="#E0A96D"/>
  <polygon points="256,90 227,256 256,220" fill="#F5BE75"/>
  <!-- South pointer -->
  <polygon points="256,422 285,256 256,292" fill="#07101E"/>
  <polygon points="256,422 227,256 256,292" fill="#1E293B"/>
  <!-- East pointer -->
  <polygon points="422,256 256,285 292,256" fill="#C78F52"/>
  <polygon points="422,256 256,227 292,256" fill="#E0A96D"/>
  <!-- West pointer -->
  <polygon points="90,256 256,285 220,256" fill="#07101E"/>
  <polygon points="90,256 256,227 220,256" fill="#1E293B"/>
  <!-- Center hub -->
  <circle cx="256" cy="256" r="24" fill="#E0A96D" stroke="#0B192C" stroke-width="6"/>
  <circle cx="256" cy="256" r="8" fill="#0B192C"/>
  <!-- North N letter -->
  <text x="256" y="70" fill="#E0A96D" font-size="36" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle">N</text>
</svg>
